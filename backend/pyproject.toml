[project]
name = "linkedin-profile-api"
version = "1.0.0"
description = "Lightweight profile information API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0"
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
